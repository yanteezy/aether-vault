<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Open a shared board · Aether</title>
<meta name="description" content="Someone shared an Aether board with you." />
<link rel="icon" href="../assets/logo.png" />
<style>
  /* The board itself lives in the part of this address after "#". Browsers never send that part to any
     server, so GitHub never sees the board — it is read here, on your device, or handed to the Aether app. */
  :root { color-scheme: dark; --accent: #0a84ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    color: rgba(255, 255, 255, 0.94);
    background: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px) 0 0/22px 22px,
                radial-gradient(circle at 50% 35%, #161a2a 0%, #0b0c12 70%);
  }
  .card {
    width: min(420px, 100%); padding: 28px 26px 22px; border-radius: 22px; text-align: center;
    background: #1c1e28; border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 30px 70px rgba(0,0,0,.5), inset 0 .5px 0 rgba(255,255,255,.1);
  }
  .logo { width: 92px; height: 92px; margin: -6px auto 6px; display: block; filter: drop-shadow(0 10px 30px rgba(34,211,238,.25)); }
  h1 { margin: 0; font-size: 20px; font-weight: 650; overflow-wrap: anywhere; }
  .meta { margin-top: 4px; font-size: 13px; color: rgba(235,235,245,.55); }
  .shield {
    display: flex; gap: 10px; align-items: center; margin: 18px 0 4px; padding: 11px 13px; border-radius: 13px; text-align: left;
    background: rgba(48,209,88,.1); border: 1px solid rgba(48,209,88,.32); color: #30d158;
  }
  .shield b { display: block; font-size: 13px; color: #fff; font-weight: 600; }
  .shield span { display: block; font-size: 11.5px; color: rgba(235,235,245,.6); }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 18px; padding: 12px;
    border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 650;
    text-decoration: none; cursor: pointer; transition: filter .15s, box-shadow .15s;
  }
  .btn:hover { color: #fff; filter: brightness(1.12); box-shadow: 0 0 0 3px rgba(10,132,255,.3), 0 0 18px rgba(10,132,255,.45); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .ghost {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px; border-radius: 11px;
    background: rgba(255,255,255,.07); color: rgba(255,255,255,.9); font: inherit; font-size: 13.5px; font-weight: 600;
    border: 0; text-decoration: none; cursor: pointer; transition: background .15s, color .15s;
  }
  .ghost:hover { background: rgba(120,150,255,.2); color: #fff; }
  .hint { margin-top: 16px; font-size: 12.5px; color: rgba(235,235,245,.5); }
  .hint kbd { font: inherit; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.1); color: rgba(255,255,255,.85); }
  .note { margin-top: 10px; font-size: 12.5px; color: #ffb35c; min-height: 1em; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 14px; }
  .chips span { padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.07); font-size: 12px; color: rgba(235,235,245,.7); }
  .foot { margin-top: 18px; font-size: 11.5px; color: rgba(235,235,245,.35); }
  .foot a { color: rgba(235,235,245,.55); }
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="../assets/logo.png" alt="" />
  <h1 id="title">A board was shared with you</h1>
  <div class="meta" id="meta">Aether · spatial notes</div>
  <div id="extra"></div>
  <a class="btn" id="open" href="#">Open in Aether</a>
  <div class="row">
    <a class="ghost" href="https://github.com/yanteezy/aether-vault/releases/latest/download/Aether-Windows-Setup.exe">Download for Windows</a>
    <a class="ghost" href="https://github.com/yanteezy/aether-vault/releases/latest/download/Aether-macOS.dmg">Download for macOS</a>
  </div>
  <div class="note" id="note"></div>
  <div class="hint">Already have Aether open? <button class="ghost" id="copy" style="display:inline-flex;flex:none;padding:3px 9px;font-size:12.5px">Copy this link</button> and press <kbd id="key">Ctrl+V</kbd> in the app.</div>
  <div class="foot">The board travels inside this link and is never sent to a server. <a href="https://github.com/yanteezy/aether-vault">About Aether</a></div>
</main>
<script>
(async () => {
  const token = decodeURIComponent(location.hash.slice(1)).trim()
  const $ = (id) => document.getElementById(id)
  if (/Mac|iPhone|iPad/.test(navigator.platform)) $('key').textContent = '⌘V'
  $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); $('copy').textContent = 'Copied' } catch { $('copy').textContent = 'Select the address bar and copy' }
  }
  const m = token.match(/^a1\.([a-z]+)\.([A-Za-z0-9_-]+)$/)
  if (!m) {
    $('title').textContent = 'This link is incomplete'
    $('meta').textContent = 'Ask the sender to copy the whole link again.'
    $('open').style.display = 'none'
    return
  }
  const flags = m[1]
  $('open').href = 'aether://open#' + token
  $('open').addEventListener('click', () => {
    // if nothing takes the aether:// link, the page is still here after a moment
    setTimeout(() => { if (document.visibilityState === 'visible') $('note').textContent = "Didn't open? Install Aether first, then click “Open in Aether” again." }, 1800)
  })
  if (flags.includes('e')) {
    $('title').textContent = 'Protected board'
    $('meta').textContent = 'You will need the password from the sender'
    $('extra').innerHTML = '<div class="shield"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5l6 2.2v4.6c0 3.9-2.6 6.9-6 8.2-3.4-1.3-6-4.3-6-8.2V4.7l6-2.2Z"/><rect x="7.4" y="9" width="5.2" height="4.2" rx="1"/><path d="M8.6 9V7.8a1.4 1.4 0 0 1 2.8 0V9"/></svg><div><b>Protected by Aether Secure Share</b><span>Encrypted with AES-256 · unlocks only with the password</span></div></div>'
    return
  }
  // an open board: show its name and a few note titles (read right here, nothing is uploaded)
  try {
    const b64 = m[2].replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - (m[2].length % 4)) % 4)
    let bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))
    if (flags.includes('z')) bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())
    const board = JSON.parse(new TextDecoder().decode(bytes))
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
    $('title').textContent = board.name || 'Shared board'
    const n = (board.notes || []).length
    $('meta').textContent = `${n} note${n === 1 ? '' : 's'}${board.frames?.length ? ` · ${board.frames.length} frame${board.frames.length === 1 ? '' : 's'}` : ''} · opens as a new workspace`
    const titles = (board.notes || []).map((x) => x.title).filter(Boolean).slice(0, 6)
    if (titles.length) $('extra').innerHTML = '<div class="chips">' + titles.map((t) => `<span>${esc(t.length > 24 ? t.slice(0, 23) + '…' : t)}</span>`).join('') + '</div>'
  } catch {
    $('meta').textContent = 'Opens as a new workspace in Aether'
  }
})()
</script>
</body>
</html>
