# Builds Aether for macOS (.dmg, Intel + Apple Silicon) and Windows (.exe),
# signs the update files with your key and creates a GitHub release with latest.json
# (the file installed apps check for updates).
#
# Start: push a tag that matches the version in package.json, e.g.
#   git tag v0.2.13 && git push origin v0.2.13
# The release is created as a DRAFT: check it on GitHub and press «Publish release» —
# only then do installed apps see the update.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --bundles nsis
            rust_targets: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Тег ${GITHUB_REF_NAME} не збігається з версією в package.json ($v). Оновіть версію в package.json."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Point the updater at this repository
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace('__REPO__',process.env.REPO))"

      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            if [ -f RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; else echo 'Нова версія Aether'; fi
            echo
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Aether v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
