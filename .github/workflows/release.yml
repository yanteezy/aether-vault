# Builds Aether for Windows (.exe) and macOS (.dmg / .zip, Intel + Apple Silicon) and creates a DRAFT
# GitHub release with everything both updaters need:
#   - latest.yml / latest-mac.yml  → this app (electron-updater) finds the next versions;
#   - latest.json + .sig files     → the OLD Aether 0.2.x (Tauri) finds v0.3.0 and installs the new app.
#
# Start: push a tag equal to the version in package.json, e.g.
#   git tag v0.3.0 && git push origin v0.3.0
# Check the draft on GitHub and press «Publish release»: only then do installed apps see the update.
#
# Secrets (already set for the old app): TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Тег ${GITHUB_REF_NAME} не збігається з версією в package.json ($v)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:prod

      - name: Installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Sign for the old Aether 0.2.x
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/legacy-update.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
            release/*.tar.gz
            release/*.sig
            release/legacy-*.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: latest.json for the old Aether
        run: node scripts/legacy-latest.mjs artifacts ${{ github.repository }}
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          # fixed-name copies, as in the old releases: links to releases/latest/download/Aether-Windows-Setup.exe keep working
          exe=$(find artifacts -name 'Aether-Setup-*.exe' | head -1); [ -n "$exe" ] && cp "$exe" artifacts/Aether-Windows-Setup.exe
          dmg=$(find artifacts -name 'Aether-*-mac.dmg' | head -1); [ -n "$dmg" ] && cp "$dmg" artifacts/Aether-macOS.dmg
          files=$(find artifacts -type f ! -name 'legacy-*.json' ! -name 'builder-debug.yml')
          gh release create "$v" --draft --title "Aether $v" --notes-file RELEASE_NOTES.md $files
